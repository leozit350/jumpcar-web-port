<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jump Car (web port)</title>
  <meta name="description" content="Browser port of Jump Car, rebuilt from the original APK's decompiled gameplay code.">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0b; color: #ddd;
      font: 14px system-ui, sans-serif; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { display: block; touch-action: none; user-select: none; -webkit-user-select: none;
      background: #000; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Jump Car"></canvas>
  <noscript>This game needs JavaScript.</noscript>
  <!-- Load order matters: data, then Futile-style core, gameplay, UI, shell. -->
  <script src="js/atlas-data.js"></script>
  <script src="js/futile.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
